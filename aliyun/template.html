<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aliyun Captcha Solver</title>
</head>
<body>
<div id="cap"></div>
<button id="btn" style="width:200px;height:44px">v</button>
<script src="https://o.alicdn.com/captcha-frontend/aliyunCaptcha/AliyunCaptcha.js"></script>
<script>
window.__ready = false;
window.__R = null;       // SDK 3.x self-verify: R = btoa({certifyId, sceneId, isSign, securityToken})
window.__verify = null;  // legacy callback payload (only when captchaVerifyCallback is set)
function boot() {
  if (typeof initAliyunCaptcha !== 'function') { setTimeout(boot, 200); return; }
  initAliyunCaptcha({
    SceneId: '__SCENE__',
    prefix: '__PREFIX__',
    mode: 'popup',
    region: '__REGION__',
    language: 'en',
    element: '#cap',
    button: '#btn',
    getInstance: function (i) { window.__inst = i; window.__ready = true; },
    // Self-verify mode (what real sites like chat.z.ai use): the widget runs its
    // own VerifyCaptchaV3, receives a securityToken, and hands back
    // R = btoa({certifyId, sceneId, isSign:true, securityToken}). No page-side
    // verify call is made, so the one-time certifyId is never burned.
    success: function (R) { window.__R = R; },
    fail: function () { window.__R = null; },
  });
}
boot();
</script>
</body>
</html>
